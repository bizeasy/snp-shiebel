<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (geoAssocType(); as geoAssocTypeRef) {
      <div>
        <h2 data-cy="geoAssocTypeDetailsHeading"><span sysTranslate="snpApp.geoAssocType.detail.title">Geo Assoc Type</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ geoAssocTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geoAssocType.name">Name</span></dt>
          <dd>
            <span>{{ geoAssocTypeRef.name }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/geo-assoc-type', geoAssocTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
