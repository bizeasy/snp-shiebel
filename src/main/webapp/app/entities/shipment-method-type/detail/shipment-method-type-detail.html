<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (shipmentMethodType(); as shipmentMethodTypeRef) {
      <div>
        <h2 data-cy="shipmentMethodTypeDetailsHeading">
          <span sysTranslate="snpApp.shipmentMethodType.detail.title">Shipment Method Type</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ shipmentMethodTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.shipmentMethodType.name">Name</span></dt>
          <dd>
            <span>{{ shipmentMethodTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.shipmentMethodType.description">Description</span></dt>
          <dd>
            <span>{{ shipmentMethodTypeRef.description }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.shipmentMethodType.sequenceNo">Sequence No</span></dt>
          <dd>
            <span>{{ shipmentMethodTypeRef.sequenceNo }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/shipment-method-type', shipmentMethodTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
