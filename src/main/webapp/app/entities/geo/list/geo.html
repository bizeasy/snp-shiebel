<div>
  <h2 id="page-heading" data-cy="GeoHeading">
    <span sysTranslate="snpApp.geo.home.title">Geos</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span sysTranslate="snpApp.geo.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-geo"
        [routerLink]="['/geo/new']"
      >
        <fa-icon icon="plus" />
        <span sysTranslate="snpApp.geo.home.createLabel">Create a new Geo</span>
      </button>
    </div>
  </h2>

  <sys-alert-error />

  <sys-alert />

  <sys-filter [filters]="filters" />

  @if (geos().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span sysTranslate="snpApp.geo.home.notFound">No Geos found</span>
    </div>
  } @else {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr sysSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" sysSortBy="id">
              <div class="d-flex">
                <span sysTranslate="global.field.id">ID</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="name">
              <div class="d-flex">
                <span sysTranslate="snpApp.geo.name">Name</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="code">
              <div class="d-flex">
                <span sysTranslate="snpApp.geo.code">Code</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="abbreviation">
              <div class="d-flex">
                <span sysTranslate="snpApp.geo.abbreviation">Abbreviation</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="geoType.name">
              <div class="d-flex">
                <span sysTranslate="snpApp.geo.geoType">Geo Type</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (geo of geos(); track trackId(geo)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/geo', geo.id, 'view']">{{ geo.id }}</a>
              </td>
              <td>{{ geo.name }}</td>
              <td>{{ geo.code }}</td>
              <td>{{ geo.abbreviation }}</td>
              <td>
                @if (geo.geoType) {
                  <div>
                    <a [routerLink]="['/geo-type', geo.geoType.id, 'view']">{{ geo.geoType.name }}</a>
                  </div>
                }
              </td>
              <td class="text-end">
                <div class="btn-group">
                  <a [routerLink]="['/geo', geo.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                    <fa-icon icon="eye" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.view">View</span>
                  </a>

                  <a [routerLink]="['/geo', geo.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                    <fa-icon icon="pencil-alt" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.edit">Edit</span>
                  </a>

                  <button type="button" (click)="delete(geo)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                    <fa-icon icon="times" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.delete">Delete</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
  @if (geos().length > 0) {
    <div>
      <div class="d-flex justify-content-center">
        <sys-item-count [params]="{ page: page(), totalItems: totalItems(), itemsPerPage: itemsPerPage() }" />
      </div>

      <div class="d-flex justify-content-center">
        <ngb-pagination
          [collectionSize]="totalItems()"
          [page]="page()"
          [pageSize]="itemsPerPage()"
          [maxSize]="5"
          [rotate]="true"
          [boundaryLinks]="true"
          (pageChange)="navigateToPage($event)"
        />
      </div>
    </div>
  }
</div>
