<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (geo(); as geoRef) {
      <div>
        <h2 data-cy="geoDetailsHeading"><span sysTranslate="snpApp.geo.detail.title">Geo</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ geoRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geo.name">Name</span></dt>
          <dd>
            <span>{{ geoRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geo.code">Code</span></dt>
          <dd>
            <span>{{ geoRef.code }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geo.abbreviation">Abbreviation</span></dt>
          <dd>
            <span>{{ geoRef.abbreviation }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geo.geoType">Geo Type</span></dt>
          <dd>
            @if (geo()!.geoType) {
              <div>
                <a [routerLink]="['/geo-type', geo()!.geoType?.id, 'view']">{{ geoRef.geoType?.name }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/geo', geoRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
