<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (productFeatureGroup(); as productFeatureGroupRef) {
      <div>
        <h2 data-cy="productFeatureGroupDetailsHeading">
          <span sysTranslate="snpApp.productFeatureGroup.detail.title">Product Feature Group</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ productFeatureGroupRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.productFeatureGroup.name">Name</span></dt>
          <dd>
            <span>{{ productFeatureGroupRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.productFeatureGroup.description">Description</span></dt>
          <dd>
            <span>{{ productFeatureGroupRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/product-feature-group', productFeatureGroupRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
