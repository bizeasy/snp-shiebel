<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (facilityType(); as facilityTypeRef) {
      <div>
        <h2 data-cy="facilityTypeDetailsHeading"><span sysTranslate="snpApp.facilityType.detail.title">Facility Type</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ facilityTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.facilityType.name">Name</span></dt>
          <dd>
            <span>{{ facilityTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.facilityType.description">Description</span></dt>
          <dd>
            <span>{{ facilityTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/facility-type', facilityTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
