@if (facilityType) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(facilityType.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="facilityTypeDeleteDialogHeading" sysTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p
        id="sys-delete-facilityType-heading"
        sysTranslate="snpApp.facilityType.delete.question"
        [translateValues]="{ id: facilityType.id }"
      >
        Are you sure you want to delete Facility Type {{ facilityType.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-facilityType" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
