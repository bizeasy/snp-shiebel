<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (contactMechPurpose(); as contactMechPurposeRef) {
      <div>
        <h2 data-cy="contactMechPurposeDetailsHeading">
          <span sysTranslate="snpApp.contactMechPurpose.detail.title">Contact Mech Purpose</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ contactMechPurposeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.contactMechPurpose.name">Name</span></dt>
          <dd>
            <span>{{ contactMechPurposeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.contactMechPurpose.description">Description</span></dt>
          <dd>
            <span>{{ contactMechPurposeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/contact-mech-purpose', contactMechPurposeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
