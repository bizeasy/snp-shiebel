<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (transactionType(); as transactionTypeRef) {
      <div>
        <h2 data-cy="transactionTypeDetailsHeading"><span sysTranslate="snpApp.transactionType.detail.title">Transaction Type</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ transactionTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.transactionType.name">Name</span></dt>
          <dd>
            <span>{{ transactionTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.transactionType.description">Description</span></dt>
          <dd>
            <span>{{ transactionTypeRef.description }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.transactionType.category">Category</span></dt>
          <dd>
            @if (transactionType()!.category) {
              <div>
                <a [routerLink]="['/transaction-category', transactionType()!.category?.id, 'view']">{{
                  transactionTypeRef.category?.name
                }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/transaction-type', transactionTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
