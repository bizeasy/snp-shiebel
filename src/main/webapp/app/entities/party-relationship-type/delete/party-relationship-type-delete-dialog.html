@if (partyRelationshipType) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(partyRelationshipType.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="partyRelationshipTypeDeleteDialogHeading" sysTranslate="entity.delete.title">
        Confirm delete operation
      </h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p
        id="sys-delete-partyRelationshipType-heading"
        sysTranslate="snpApp.partyRelationshipType.delete.question"
        [translateValues]="{ id: partyRelationshipType.id }"
      >
        Are you sure you want to delete Party Relationship Type {{ partyRelationshipType.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-partyRelationshipType" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
