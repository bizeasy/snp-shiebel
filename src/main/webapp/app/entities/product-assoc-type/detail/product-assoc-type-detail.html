<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (productAssocType(); as productAssocTypeRef) {
      <div>
        <h2 data-cy="productAssocTypeDetailsHeading">
          <span sysTranslate="snpApp.productAssocType.detail.title">Product Assoc Type</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ productAssocTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.productAssocType.name">Name</span></dt>
          <dd>
            <span>{{ productAssocTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.productAssocType.description">Description</span></dt>
          <dd>
            <span>{{ productAssocTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/product-assoc-type', productAssocTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
