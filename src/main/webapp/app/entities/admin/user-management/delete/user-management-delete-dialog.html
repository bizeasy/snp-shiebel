@if (userManagement) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(userManagement.login)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="userManagementDeleteDialogHeading" sysTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p
        id="sys-delete-userManagement-heading"
        sysTranslate="userManagement.delete.question"
        [translateValues]="{ id: userManagement.login }"
      >
        Are you sure you want to delete user {{ userManagement.login }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-userManagement" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
