@if (quoteType) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(quoteType.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="quoteTypeDeleteDialogHeading" sysTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p id="sys-delete-quoteType-heading" sysTranslate="snpApp.quoteType.delete.question" [translateValues]="{ id: quoteType.id }">
        Are you sure you want to delete Quote Type {{ quoteType.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-quoteType" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
