<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (geoPoint(); as geoPointRef) {
      <div>
        <h2 data-cy="geoPointDetailsHeading"><span sysTranslate="snpApp.geoPoint.detail.title">Geo Point</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ geoPointRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geoPoint.latitude">Latitude</span></dt>
          <dd>
            <span>{{ geoPointRef.latitude }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.geoPoint.longitude">Longitude</span></dt>
          <dd>
            <span>{{ geoPointRef.longitude }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/geo-point', geoPointRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
