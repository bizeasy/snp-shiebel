<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (customTimePeriod(); as customTimePeriodRef) {
      <div>
        <h2 data-cy="customTimePeriodDetailsHeading">
          <span sysTranslate="snpApp.customTimePeriod.detail.title">Custom Time Period</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ customTimePeriodRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.customTimePeriod.name">Name</span></dt>
          <dd>
            <span>{{ customTimePeriodRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.customTimePeriod.fromDate">From Date</span></dt>
          <dd>
            <span>{{ customTimePeriodRef.fromDate | formatMediumDate }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.customTimePeriod.thruDate">Thru Date</span></dt>
          <dd>
            <span>{{ customTimePeriodRef.thruDate | formatMediumDate }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/custom-time-period', customTimePeriodRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
