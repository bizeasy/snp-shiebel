<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="sys-contact-mech-heading" data-cy="ContactMechCreateUpdateHeading" sysTranslate="snpApp.contactMech.home.createOrEditLabel">
        Create or edit a Contact Mech
      </h2>

      <div>
        <sys-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" sysTranslate="global.field.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        @let infoStringRef = editForm.get('infoString')!;
        <div class="mb-3">
          <label class="form-label" for="field_infoString" sysTranslate="snpApp.contactMech.infoString">Info String</label>
          <input
            type="text"
            class="form-control"
            name="infoString"
            id="field_infoString"
            data-cy="infoString"
            formControlName="infoString"
          />
          @if (infoStringRef.invalid && (infoStringRef.dirty || infoStringRef.touched)) {
            <div>
              @if (infoStringRef.errors?.maxlength) {
                <small class="form-text text-danger" sysTranslate="entity.validation.maxlength" [translateValues]="{ max: '255' }"
                  >This field cannot be longer than 255 characters.</small
                >
              }
            </div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_contactMechType" sysTranslate="snpApp.contactMech.contactMechType">Contact Mech Type</label>
          <select
            class="form-select"
            id="field_contactMechType"
            data-cy="contactMechType"
            name="contactMechType"
            formControlName="contactMechType"
            [compareWith]="compareContactMechType"
          >
            <option [ngValue]="null"></option>
            @for (contactMechTypeOption of contactMechTypesSharedCollection(); track $index) {
              <option [ngValue]="contactMechTypeOption">{{ contactMechTypeOption.name }}</option>
            }
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <fa-icon icon="save" />&nbsp;<span sysTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
