@if (custRequestItem) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(custRequestItem.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="custRequestItemDeleteDialogHeading" sysTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p
        id="sys-delete-custRequestItem-heading"
        sysTranslate="snpApp.custRequestItem.delete.question"
        [translateValues]="{ id: custRequestItem.id }"
      >
        Are you sure you want to delete Cust Request Item {{ custRequestItem.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-custRequestItem" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
