<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (invoiceItemType(); as invoiceItemTypeRef) {
      <div>
        <h2 data-cy="invoiceItemTypeDetailsHeading"><span sysTranslate="snpApp.invoiceItemType.detail.title">Invoice Item Type</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ invoiceItemTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.invoiceItemType.name">Name</span></dt>
          <dd>
            <span>{{ invoiceItemTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.invoiceItemType.description">Description</span></dt>
          <dd>
            <span>{{ invoiceItemTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/invoice-item-type', invoiceItemTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
