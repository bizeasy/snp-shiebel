<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (uom(); as uomRef) {
      <div>
        <h2 data-cy="uomDetailsHeading"><span sysTranslate="snpApp.uom.detail.title">Uom</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ uomRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.uom.name">Name</span></dt>
          <dd>
            <span>{{ uomRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.uom.description">Description</span></dt>
          <dd>
            <span>{{ uomRef.description }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.uom.sequenceNo">Sequence No</span></dt>
          <dd>
            <span>{{ uomRef.sequenceNo }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.uom.abbreviation">Abbreviation</span></dt>
          <dd>
            <span>{{ uomRef.abbreviation }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.uom.uomType">Uom Type</span></dt>
          <dd>
            @if (uom()!.uomType) {
              <div>
                <a [routerLink]="['/uom-type', uom()!.uomType?.id, 'view']">{{ uomRef.uomType?.name }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/uom', uomRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
