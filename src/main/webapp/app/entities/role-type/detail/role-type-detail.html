<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (roleType(); as roleTypeRef) {
      <div>
        <h2 data-cy="roleTypeDetailsHeading"><span sysTranslate="snpApp.roleType.detail.title">Role Type</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ roleTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.roleType.name">Name</span></dt>
          <dd>
            <span>{{ roleTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.roleType.description">Description</span></dt>
          <dd>
            <span>{{ roleTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/role-type', roleTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
