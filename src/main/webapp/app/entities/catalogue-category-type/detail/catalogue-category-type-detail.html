<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (catalogueCategoryType(); as catalogueCategoryTypeRef) {
      <div>
        <h2 data-cy="catalogueCategoryTypeDetailsHeading">
          <span sysTranslate="snpApp.catalogueCategoryType.detail.title">Catalogue Category Type</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ catalogueCategoryTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.catalogueCategoryType.name">Name</span></dt>
          <dd>
            <span>{{ catalogueCategoryTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.catalogueCategoryType.description">Description</span></dt>
          <dd>
            <span>{{ catalogueCategoryTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/catalogue-category-type', catalogueCategoryTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
