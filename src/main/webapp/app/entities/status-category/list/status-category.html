<div>
  <h2 id="page-heading" data-cy="StatusCategoryHeading">
    <span sysTranslate="snpApp.statusCategory.home.title">Status Categories</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span sysTranslate="snpApp.statusCategory.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-status-category"
        [routerLink]="['/status-category/new']"
      >
        <fa-icon icon="plus" />
        <span sysTranslate="snpApp.statusCategory.home.createLabel">Create a new Status Category</span>
      </button>
    </div>
  </h2>

  <sys-alert-error />

  <sys-alert />

  @if (statusCategories().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span sysTranslate="snpApp.statusCategory.home.notFound">No Status Categories found</span>
    </div>
  } @else {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr sysSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" sysSortBy="id">
              <div class="d-flex">
                <span sysTranslate="global.field.id">ID</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="name">
              <div class="d-flex">
                <span sysTranslate="snpApp.statusCategory.name">Name</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="description">
              <div class="d-flex">
                <span sysTranslate="snpApp.statusCategory.description">Description</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (statusCategory of statusCategories(); track trackId(statusCategory)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/status-category', statusCategory.id, 'view']">{{ statusCategory.id }}</a>
              </td>
              <td>{{ statusCategory.name }}</td>
              <td>{{ statusCategory.description }}</td>
              <td class="text-end">
                <div class="btn-group">
                  <a
                    [routerLink]="['/status-category', statusCategory.id, 'view']"
                    class="btn btn-info btn-sm"
                    data-cy="entityDetailsButton"
                  >
                    <fa-icon icon="eye" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.view">View</span>
                  </a>

                  <a
                    [routerLink]="['/status-category', statusCategory.id, 'edit']"
                    class="btn btn-primary btn-sm"
                    data-cy="entityEditButton"
                  >
                    <fa-icon icon="pencil-alt" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.edit">Edit</span>
                  </a>

                  <button type="button" (click)="delete(statusCategory)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                    <fa-icon icon="times" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.delete">Delete</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
