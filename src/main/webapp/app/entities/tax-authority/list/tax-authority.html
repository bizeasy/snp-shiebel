<div>
  <h2 id="page-heading" data-cy="TaxAuthorityHeading">
    <span sysTranslate="snpApp.taxAuthority.home.title">Tax Authorities</span>

    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span sysTranslate="snpApp.taxAuthority.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-tax-authority"
        [routerLink]="['/tax-authority/new']"
      >
        <fa-icon icon="plus" />
        <span sysTranslate="snpApp.taxAuthority.home.createLabel">Create a new Tax Authority</span>
      </button>
    </div>
  </h2>

  <sys-alert-error />

  <sys-alert />

  @if (taxAuthorities().length === 0) {
    <div class="alert alert-warning" id="no-result">
      <span sysTranslate="snpApp.taxAuthority.home.notFound">No Tax Authorities found</span>
    </div>
  } @else {
    <div class="table-responsive table-entities" id="entities">
      <table class="table table-striped" aria-describedby="page-heading">
        <thead>
          <tr sysSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" sysSortBy="id">
              <div class="d-flex">
                <span sysTranslate="global.field.id">ID</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="name">
              <div class="d-flex">
                <span sysTranslate="snpApp.taxAuthority.name">Name</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col" sysSortBy="geo.name">
              <div class="d-flex">
                <span sysTranslate="snpApp.taxAuthority.geo">Geo</span>
                <fa-icon class="p-1" icon="sort" />
              </div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (taxAuthority of taxAuthorities(); track trackId(taxAuthority)) {
            <tr data-cy="entityTable">
              <td>
                <a [routerLink]="['/tax-authority', taxAuthority.id, 'view']">{{ taxAuthority.id }}</a>
              </td>
              <td>{{ taxAuthority.name }}</td>
              <td>
                @if (taxAuthority.geo) {
                  <div>
                    <a [routerLink]="['/geo', taxAuthority.geo.id, 'view']">{{ taxAuthority.geo.name }}</a>
                  </div>
                }
              </td>
              <td class="text-end">
                <div class="btn-group">
                  <a [routerLink]="['/tax-authority', taxAuthority.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                    <fa-icon icon="eye" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.view">View</span>
                  </a>

                  <a [routerLink]="['/tax-authority', taxAuthority.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                    <fa-icon icon="pencil-alt" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.edit">Edit</span>
                  </a>

                  <button type="button" (click)="delete(taxAuthority)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                    <fa-icon icon="times" />
                    <span class="d-none d-md-inline" sysTranslate="entity.action.delete">Delete</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
