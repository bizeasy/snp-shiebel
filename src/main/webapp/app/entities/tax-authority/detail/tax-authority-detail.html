<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (taxAuthority(); as taxAuthorityRef) {
      <div>
        <h2 data-cy="taxAuthorityDetailsHeading"><span sysTranslate="snpApp.taxAuthority.detail.title">Tax Authority</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ taxAuthorityRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.taxAuthority.name">Name</span></dt>
          <dd>
            <span>{{ taxAuthorityRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.taxAuthority.geo">Geo</span></dt>
          <dd>
            @if (taxAuthority()!.geo) {
              <div>
                <a [routerLink]="['/geo', taxAuthority()!.geo?.id, 'view']">{{ taxAuthorityRef.geo?.name }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/tax-authority', taxAuthorityRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
