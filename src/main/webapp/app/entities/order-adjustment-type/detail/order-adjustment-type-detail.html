<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (orderAdjustmentType(); as orderAdjustmentTypeRef) {
      <div>
        <h2 data-cy="orderAdjustmentTypeDetailsHeading">
          <span sysTranslate="snpApp.orderAdjustmentType.detail.title">Order Adjustment Type</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ orderAdjustmentTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.orderAdjustmentType.name">Name</span></dt>
          <dd>
            <span>{{ orderAdjustmentTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.orderAdjustmentType.description">Description</span></dt>
          <dd>
            <span>{{ orderAdjustmentTypeRef.description }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.orderAdjustmentType.parent">Parent</span></dt>
          <dd>
            @if (orderAdjustmentType()!.parent) {
              <div>
                <a [routerLink]="['/order-adjustment-type', orderAdjustmentType()!.parent?.id, 'view']">{{
                  orderAdjustmentTypeRef.parent?.name
                }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/order-adjustment-type', orderAdjustmentTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
