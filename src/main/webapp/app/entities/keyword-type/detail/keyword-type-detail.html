<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (keywordType(); as keywordTypeRef) {
      <div>
        <h2 data-cy="keywordTypeDetailsHeading"><span sysTranslate="snpApp.keywordType.detail.title">Keyword Type</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ keywordTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.keywordType.name">Name</span></dt>
          <dd>
            <span>{{ keywordTypeRef.name }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/keyword-type', keywordTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
