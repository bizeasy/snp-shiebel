<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (partyRole(); as partyRoleRef) {
      <div>
        <h2 data-cy="partyRoleDetailsHeading"><span sysTranslate="snpApp.partyRole.detail.title">Party Role</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ partyRoleRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.partyRole.party">Party</span></dt>
          <dd>
            @if (partyRole()!.party) {
              <div>
                <a [routerLink]="['/party', partyRole()!.party?.id, 'view']">{{ partyRoleRef.party?.id }}</a>
              </div>
            }
          </dd>
          <dt><span sysTranslate="snpApp.partyRole.roleType">Role Type</span></dt>
          <dd>
            @if (partyRole()!.roleType) {
              <div>
                <a [routerLink]="['/role-type', partyRole()!.roleType?.id, 'view']">{{ partyRoleRef.roleType?.name }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/party-role', partyRoleRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
