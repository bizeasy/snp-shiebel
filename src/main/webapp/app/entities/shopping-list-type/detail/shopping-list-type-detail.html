<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (shoppingListType(); as shoppingListTypeRef) {
      <div>
        <h2 data-cy="shoppingListTypeDetailsHeading">
          <span sysTranslate="snpApp.shoppingListType.detail.title">Shopping List Type</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ shoppingListTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.shoppingListType.name">Name</span></dt>
          <dd>
            <span>{{ shoppingListTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.shoppingListType.description">Description</span></dt>
          <dd>
            <span>{{ shoppingListTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/shopping-list-type', shoppingListTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
