@if (custRequestItemAttachment) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(custRequestItemAttachment.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="custRequestItemAttachmentDeleteDialogHeading" sysTranslate="entity.delete.title">
        Confirm delete operation
      </h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p
        id="sys-delete-custRequestItemAttachment-heading"
        sysTranslate="snpApp.custRequestItemAttachment.delete.question"
        [translateValues]="{ id: custRequestItemAttachment.id }"
      >
        Are you sure you want to delete Cust Request Item Attachment {{ custRequestItemAttachment.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-custRequestItemAttachment" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
