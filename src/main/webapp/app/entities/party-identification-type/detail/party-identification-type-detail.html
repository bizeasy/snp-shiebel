<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (partyIdentificationType(); as partyIdentificationTypeRef) {
      <div>
        <h2 data-cy="partyIdentificationTypeDetailsHeading">
          <span sysTranslate="snpApp.partyIdentificationType.detail.title">Party Identification Type</span>
        </h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ partyIdentificationTypeRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.partyIdentificationType.name">Name</span></dt>
          <dd>
            <span>{{ partyIdentificationTypeRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.partyIdentificationType.description">Description</span></dt>
          <dd>
            <span>{{ partyIdentificationTypeRef.description }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/party-identification-type', partyIdentificationTypeRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
