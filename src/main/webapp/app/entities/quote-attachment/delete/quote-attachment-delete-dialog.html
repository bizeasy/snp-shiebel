@if (quoteAttachment) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(quoteAttachment.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="quoteAttachmentDeleteDialogHeading" sysTranslate="entity.delete.title">Confirm delete operation</h4>
    </div>

    <div class="modal-body">
      <sys-alert-error />
      <p
        id="sys-delete-quoteAttachment-heading"
        sysTranslate="snpApp.quoteAttachment.delete.question"
        [translateValues]="{ id: quoteAttachment.id }"
      >
        Are you sure you want to delete Quote Attachment {{ quoteAttachment.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span sysTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="sys-confirm-delete-quoteAttachment" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span sysTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
