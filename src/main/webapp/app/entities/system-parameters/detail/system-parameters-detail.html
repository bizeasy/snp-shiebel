<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (systemParameters(); as systemParametersRef) {
      <div>
        <h2 data-cy="systemParametersDetailsHeading"><span sysTranslate="snpApp.systemParameters.detail.title">System Parameters</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ systemParametersRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.systemParameters.key">Key</span></dt>
          <dd>
            <span>{{ systemParametersRef.key }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.systemParameters.value">Value</span></dt>
          <dd>
            <span>{{ systemParametersRef.value }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.systemParameters.description">Description</span></dt>
          <dd>
            <span>{{ systemParametersRef.description }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.systemParameters.environment">Environment</span></dt>
          <dd>
            <span>{{ systemParametersRef.environment }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/system-parameters', systemParametersRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
