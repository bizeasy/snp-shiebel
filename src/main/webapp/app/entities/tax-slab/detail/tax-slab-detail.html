<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (taxSlab(); as taxSlabRef) {
      <div>
        <h2 data-cy="taxSlabDetailsHeading"><span sysTranslate="snpApp.taxSlab.detail.title">Tax Slab</span></h2>

        <hr />

        <sys-alert-error />

        <sys-alert />

        <dl class="row-md jh-entity-details">
          <dt><span sysTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ taxSlabRef.id }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.taxSlab.name">Name</span></dt>
          <dd>
            <span>{{ taxSlabRef.name }}</span>
          </dd>
          <dt><span sysTranslate="snpApp.taxSlab.rate">Rate</span></dt>
          <dd>
            <span>{{ taxSlabRef.rate }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span sysTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/tax-slab', taxSlabRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span sysTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
